# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1, 1920x1080@100.00, 0x0, 1

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$nvim = alacritty -e nvim
$browser = librewolf
$fileManager = pcmanfm
$menu = wofi -show drun

$steam = steam
$discord = discord
$obs = obs
$virt = virt-manager
$signal = signal-desktop
$telegram = telegram-desktop
$lutris = lutris
$gzdoom = gzdoom
$slock = swaylock
$passmenu = rofi-pass
$blueman = blueman-manager
$hyprlock = hyprlock
$screenshot = flameshot gui

#################
### AUTOSTART ###
#################
# GPG agent
exec-once = gpgconf --kill gpg-agent
exec-once = gpg-agent --daemon --pinentry-program /usr/bin/pinentry-gtk

# Audio
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber

# UI
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle

# Background services
exec-once = mpd
exec-once = mako
exec-once = lxqt-policykit-agent

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Night light
#exec-once = wlsunset -l 45.16031 -L 10.79784


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 0

    border_size = 3

    col.active_border = rgba(009246ff)
    col.inactive_border = rgba(000000ff)

    resize_on_border = false
    layout = master
}

master {
    new_status = slave
    new_on_top = false
    allow_small_split = false
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = false
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true

    enable_swallow = true
    swallow_regex = ^(Alacritty|kitty|footclient)$
}

#############
### INPUT ###
#############

input {
    kb_layout = us, it, es
    kb_options = grp:alt_space_toggle

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# --- Launch apps ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $nvim
bind = $mainMod, P, exec, $browser
bind = $mainMod, T, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, D, exec, $discord
bind = $mainMod, O, exec, $obs
bind = $mainMod, V, exec, $virt
bind = $mainMod, S, exec, $screenshot

bind = $mainMod SHIFT, S, exec, $steam
bind = $mainMod SHIFT, A, exec, $signal
bind = $mainMod SHIFT, B, exec, $blueman
bind = $mainMod SHIFT, TAB, exec, $passmenu
bind = $mainMod SHIFT, P, exec, $hyprlock
# TODO: Fix this with fuzzel instead of wofi
#bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --- Window management ---
bind = $mainMod, W, killactive
bind = $mainMod SHIFT, Q, exit

bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev

bind = $mainMod, TAB, fullscreen, 1 # Use 0 for TRUE fullscreen
bind = $mainMod SHIFT, RETURN, layoutmsg#, swapwithmaster

bind = $mainMod, H, layoutmsg, mfact -0.05
bind = $mainMod, L, layoutmsg, mfact +0.05

bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, F, fullscreen

# --- Move windows ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating


# --- Media keys ---
bindel = ,F8, exec, $HOME/.config/hypr/scripts/volume --inc
bindel = ,F7, exec, $HOME/.config/hypr/scripts/volume --dec
bindel = ,F6, exec, $HOME/.config/hypr/scripts/volume --toggle

bindl = , F9, exec, mpc next
bindl = , F10, exec, mpc toggle
bindl = , F11, exec, mpc prev

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Browsers (workspace 1)
windowrule = match:class ^(firefox|Brave|librewolf|LibreWolf|chromium)$, workspace 1 silent

# Games / launchers (workspace 2)
windowrule = match:class Lutris, workspace 2 silent
windowrule = match:class GZDoom, workspace 2 silent
windowrule = match:class minecraft-launcher, workspace 2 silent
windowrule = match:title ^(Heroic Games Launcher)$, workspace 2 silent

# Work / files (workspace 3)
windowrule = match:class Gimp, workspace 3 silent
windowrule = match:class libreoffice, workspace 3 silent
windowrule = match:class Syncthing GTK, workspace 3 silent
windowrule = match:class qbittorrent, workspace 3 silent

# Discord (workspace 4)
windowrule = match:class discord, workspace 4 silent

# Telegram (workspace 5)
windowrule = match:class telegram-desktop, workspace 5 silent
windowrule = match:class TelegramDesktop, workspace 5 silent

# Games (workspace 6)
windowrule = match:class Steam, workspace 6 silent
windowrule = match:class steam, workspace 6 silent

# Signal / sharing (workspace 7)
windowrule = match:class Signal, workspace 7 silent
windowrule = match:class localsend, workspace 7 silent

# VM / OBS (workspace 8)
windowrule = match:class obs, workspace 9 silent
windowrule = match:title ^(Virtual Machine Manager)$, workspace 9 silent

# VM guest window (workspace 8)
windowrule = match:title ^(win11 on QEMU/KVM)$, workspace 8 silent

# Special floating
windowrule = match:class ollama-float, float on

# Terminal (no workspace rule, but mark as terminal if needed later)
windowrule = match:class Alacritty
